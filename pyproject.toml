[project]
name = "granola-cli"
version = "0.1.0"
description = "One CLI for Granola: decrypt on-disk creds, read/share/edit notes, sync + full-text search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xuelong Mu" }]
keywords = ["granola", "meeting-notes", "cli", "transcripts"]
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/"  # TODO: set on first push

[project.scripts]
granola = "granola.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["granola"]

[tool.hatch.build.targets.wheel.force-include]
"granola/granola-api-routes.json" = "granola/granola-api-routes.json"
