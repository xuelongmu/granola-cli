[project]
name = "granola-cli"
dynamic = ["version"]
description = "One CLI for Granola: decrypt on-disk creds and drive the documented internal API (read/share/edit notes)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Granola CLI contributors" }]
keywords = ["granola", "meeting-notes", "cli", "transcripts"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Utilities",
]
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/xuelongmu/granola-cli"
Repository = "https://github.com/xuelongmu/granola-cli"
Issues = "https://github.com/xuelongmu/granola-cli/issues"

[project.scripts]
granola = "granola.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "granola/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["granola"]

[tool.hatch.build.targets.wheel.force-include]
"granola/granola-api-routes.json" = "granola/granola-api-routes.json"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
